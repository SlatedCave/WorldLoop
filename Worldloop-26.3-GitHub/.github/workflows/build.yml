name: Build Worldloop

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build Minecraft 26.3 mod
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Run tests and compile mod
        run: |
          chmod +x ./gradlew
          ./gradlew test build --no-daemon

      - name: Upload compiled mod JAR
        uses: actions/upload-artifact@v7
        with:
          name: worldloop-minecraft-26.3
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
